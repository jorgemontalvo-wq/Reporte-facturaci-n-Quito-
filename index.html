<style>
  :root{
    --guinda:#7A1F2B; --guinda-soft:#F6E9EA; --gray:#4B5563; --gray-light:#F3F4F6;
    --border:#D8D2D0; --green:#166534; --green-soft:#EAF6EE; --amber:#92400E; --amber-soft:#FEF3E0;
    --red:#991B1B; --red-soft:#FDEDED; --ink:#231716;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Arial, Helvetica, sans-serif;color:var(--ink);background:#EFECEA;}
  #app{max-width:1180px;margin:0 auto;padding:16px;}
  table{border-collapse:collapse;width:100%;}
  th,td{border:1px solid var(--border);padding:5px 8px;font-size:12px;text-align:left;vertical-align:top;}
  th{background:var(--gray-light);color:var(--gray);font-size:11.5px;font-weight:700;white-space:nowrap;}
  .card{background:#fff;border:1px solid var(--border);border-radius:4px;}
  .btn{border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:4px;padding:7px 13px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-primary{background:var(--guinda);color:#fff;border-color:var(--guinda);}
  .btn-green{background:var(--green);color:#fff;border-color:var(--green);}
  .input{border:1px solid var(--border);border-radius:3px;padding:5px 8px;font-size:12.5px;width:100%;}
  .section-bar{display:flex;align-items:center;justify-content:space-between;margin:24px 0 10px;border-bottom:2px solid var(--guinda);padding-bottom:5px;}
  .section-bar .t{color:var(--guinda);font-weight:800;font-size:14px;}
  .kpi{border:1px solid var(--border);border-radius:4px;padding:12px 14px;background:#fff;flex:1 1 160px;min-width:150px;}
  .kpi .l{font-size:11px;color:var(--gray);font-weight:600;margin-bottom:4px;}
  .kpi .v{font-size:20px;font-weight:700;}
  .kpi .s{font-size:10.5px;color:var(--gray);margin-top:2px;}
  .row-wrap{display:flex;gap:10px;flex-wrap:wrap;}
  .empty{border:1px dashed var(--border);border-radius:6px;padding:28px 20px;text-align:center;color:var(--gray);background:#fff;}
  .empty .ti{font-weight:600;font-size:13px;color:var(--ink);}
  .badge-pill{display:inline-flex;align-items:center;gap:8px;background:var(--gray-light);border-radius:999px;padding:6px 16px;font-size:12px;}
  .month-tab{padding:9px 16px;border-radius:4px;font-weight:800;font-size:12.5px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--ink);}
  .month-tab.active{border-color:var(--guinda);background:var(--guinda);color:#fff;}
  .month-tab-add{padding:9px 14px;border-radius:4px;font-size:12.5px;border:1px dashed var(--border);background:#fff;color:var(--gray);cursor:pointer;}
  .exc-item{border-radius:4px;padding:9px 12px;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);margin-bottom:8px;}
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:4px;}
  .origen-btn{border:none;background:transparent;cursor:pointer;color:var(--gray);padding:2px;font-size:13px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(35,23,22,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal-box{background:#fff;border-radius:6px;max-width:560px;width:100%;max-height:80vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25);}
  .modal-head{background:var(--guinda);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;}
  .modal-body{padding:16px;font-size:12.5px;}
  .no-print{}
  @media print{ .no-print{display:none !important;} body{background:#fff !important;} }
  ul.reglas{padding-left:18px;margin:0;font-size:12.5px;line-height:1.6;}
  a.x-close{color:#fff;text-decoration:none;cursor:pointer;font-size:16px;}
</style>

function buildColumnIndex(headerRowNorm, headerMap) {
  const index = {};
  const missing = [];
  for (const key of Object.keys(headerMap)) {
    const candidates = headerMap[key];
    let found = -1;
    for (let c = 0; c < headerRowNorm.length; c++) {
      const h = headerRowNorm[c];
      if (!h) continue;
      if (candidates.some((cand) => h === cand || h.includes(cand))) { found = c; break; }
    }
    if (found === -1) missing.push(key);
    index[key] = found;
  }
  return { index, missing };
}

function findHeaderRow(aoa, mustContain) {
  let bestRow = -1, bestScore = -1;
  for (let r = 0; r < Math.min(aoa.length, 10); r++) {
    const rowNorm = (aoa[r] || []).map(norm);
    let score = 0;
    for (const tok of mustContain) if (rowNorm.some((h) => h.includes(tok))) score++;
    if (score > bestScore) { bestScore = score; bestRow = r; }
  }
  return bestScore >= 2 ? bestRow : -1;
}

function toJsDate(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
  if (typeof v === 'number') {
    const d = XLSX.SSF.parse_date_code(v);
    if (!d) return null;
    return new Date(d.y, d.m - 1, d.d);
  }
  if (typeof v === 'string') {
    const s = v.trim();
    // Parseo explícito como fecha LOCAL (evita el corrimiento de un día que
    // produce `new Date('YYYY-MM-DD')`, que JS interpreta como UTC medianoche).
    let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
    if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
  }
  const d2 = new Date(v);
  return isNaN(d2.getTime()) ? null : d2;
}

function fmtDate(d) {
  if (!d) return '';
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  return `${dd}/${mm}/${d.getFullYear()}`;
}

function fmtMoney(n) {
  if (n == null || isNaN(n)) return '';
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString('es-EC', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtGal(n) {
  if (n == null || isNaN(n)) return '';
  return n.toLocaleString('es-EC', { minimumFractionDigits: 1, maximumFractionDigits: 2 }) + ' gl';
}

function cellText(v) {
  if (v == null) return '';
  if (v instanceof Date) return fmtDate(v);
  return String(v);
}

function isCancelado(v) { return norm(v) === 'cancelado'; }

function serializeRow(r) {
  const out = {};
  for (const k of Object.keys(r)) {
    const v = r[k];
    out[k] = v instanceof Date ? { __date: v.toISOString() } : v;
  }
  return out;
}
function deserializeRow(r) {
  const out = {};
  for (const k of Object.keys(r)) {
    const v = r[k];
    out[k] = (v && typeof v === 'object' && v.__date) ? new Date(v.__date) : v;
  }
  return out;
}

function findSheetByName(wb, candidates) {
  const names = wb.SheetNames;
  for (const cand of candidates) {
    const hit = names.find((n) => norm(n) === norm(cand));
    if (hit) return hit;
  }
  for (const cand of candidates) {
    const hit = names.find((n) => norm(n).includes(norm(cand)));
    if (hit) return hit;
  }
  return null;
}

function parseShayaWorkbook(wb) {
  const sheetName = findSheetByName(wb, ['SHAYA B61', 'SHAYA BL 61', 'SHAYA']);
  if (!sheetName) {
    return { rows: [], structureErrors: ['No se encontró una hoja "SHAYA B61" en el archivo REPORTE COMBUSTIBLE CLIENTES.'], sheetName: null };
  }

    : [];

  const rows = [];
  for (let r = headerRowIdx + 1; r < aoa.length; r++) {
    const row = aoa[r] || [];
    const isEmpty = row.every((v) => v == null || v === '');
    if (isEmpty) continue;
    const get = (key) => (index[key] >= 0 ? row[index[key]] : null);
    const proveedor = get('proveedor');
    const isTrasvase = norm(proveedor) === 'trasvase';
    rows.push({
      _sourceFile: 'REPORTE COMBUSTIBLE CLIENTES',
      _sourceSheet: sheetName,
      _sourceRow: r + 1,
      proveedor: cellText(proveedor),
      cliente: cellText(get('cliente')),
      ref: get('ref'),
      localidad: cellText(get('localidad')),
      medio: cellText(get('medio')),
      reqGl: typeof get('reqGl') === 'number' ? get('reqGl') : null,
      fechaPedido: toJsDate(get('fechaPedido')),
      fechaDespacho: toJsDate(get('fechaDespacho')),
      terminal: cellText(get('terminal')),
      factura: cellText(get('factura')),
      fechaEmisionFactura: toJsDate(get('fechaEmisionFactura')),

/* ---------------------------------------------------------------------------
   PERÍODO DE CORTE (26 del mes anterior → 25 del mes actual)
--------------------------------------------------------------------------- */
function periodFromMonth(year, month) {
  const end = new Date(year, month - 1, 25, 23, 59, 59, 999);
  const startMonth = month - 1 === 0 ? 12 : month - 1;
  const startYear = month - 1 === 0 ? year - 1 : year;
  const start = new Date(startYear, startMonth - 1, 26, 0, 0, 0, 0);
  return { start, end, label: `${fmtDate(start)} al ${fmtDate(end)}` };
}

function inRange(d, start, end) {
  if (!d) return false;
  return d.getTime() >= start.getTime() && d.getTime() <= end.getTime();
}

/* ---------------------------------------------------------------------------
   TABLA PRINCIPAL — agrupada por # Ref + filas TRASVASE
--------------------------------------------------------------------------- */
function buildMainTable(shayaRows, start, end) {
  const normales = shayaRows.filter((r) => !r.isTrasvase);
  // Regla vigente: cada fila entra ÚNICAMENTE si su propia FECHA DE EMBARQUE
  // cae dentro del corte (26 → 25). Ya NO se incluyen filas de un mismo # Ref
  // que caigan fuera del período solo porque otra fila del mismo # Ref sí
  // califica (esto generaba fechas fuera del corte en el informe).
  const merged = normales
    .filter((r) => inRange(r.fechaEmbarque, start, end))
    .sort((a, b) => a._sourceRow - b._sourceRow);

  return { merged, fallbackIncluded: [] };
}

/* ---------------------------------------------------------------------------
   TRASVASES — fuente única: el Excel dedicado de Trasvases (ya NO se derivan
   de SHAYA B61 ni se cruzan contra el Reporte Diario)
--------------------------------------------------------------------------- */
function buildTrasvasesFromFile(trasvaseRows, start, end) {
  return trasvaseRows.filter((r) => inRange(r.fecha, start, end)).sort((a, b) => a._sourceRow - b._sourceRow);
}

/* ---------------------------------------------------------------------------
   CONSUMO DE COMBUSTIBLE PROPIO (camioneta / tanquero) DESDE INFORME
--------------------------------------------------------------------------- */
function buildConsumoPropio(informeRows, placa, start, end) {
  const placaKey = placa.toUpperCase().replace(/[\s-]/g, '');
  return informeRows
    .filter((r) => r.placa.replace(/[\s-]/g, '') === placaKey)
    .filter((r) => norm(r.empresa) === 'tecknologistic')
    .filter((r) => inRange(r.fecha, start, end))
    .sort((a, b) => a.fecha.getTime() - b.fecha.getTime());
}

/* ---------------------------------------------------------------------------
   FACTURACIÓN — cálculo final del período
--------------------------------------------------------------------------- */
function computeFacturacion(opts) {
  const { mainRows, trasvasesInRange, standbyRows, consumoCamioneta, consumoTanquero, contrato, manejoIntegralActivo } = opts;
  const items = [];

  if (manejoIntegralActivo) {
    items.push({ concepto: 'Manejo Integral de Diesel (fijo contrato)', cantidad: 1, precio: contrato.manejoIntegral, subtotal: contrato.manejoIntegral, tipo: 'fijo' });
  }

  const volumenPorTerminal = { ESMERALDAS: 0, BEATERIO: 0, SHUSHUFINDI: 0, 'SANTO DOMINGO': 0 };
  for (const r of mainRows) {
    if (r.isTrasvase || r.isCancelado) continue;
    const key = Object.keys(volumenPorTerminal).find((k) => norm(r.terminal) === norm(k));
    if (key && r.volumenDespachado) volumenPorTerminal[key] += r.volumenDespachado;
  }
  for (const term of Object.keys(volumenPorTerminal)) {
    const vol = volumenPorTerminal[term];
    const precio = contrato.precioTerminal[term] ?? 0;
    items.push({ concepto: `Transporte Diesel terminal ${term}`, cantidad: vol, precio, subtotal: vol * precio, tipo: 'transporte' });
  }

  trasvasesInRange.forEach((tv) => {
    const locTxt = tv.locacion ? `, LOCACIÓN ${tv.locacion}` : '';
    const pozoTxt = tv.pozo ? `, POZO ${tv.pozo}` : '';
    const precio = (typeof tv.tarifa === 'number' && tv.tarifa > 0) ? tv.tarifa : contrato.precioTrasvase;
    items.push({
      concepto: `Servicio de Trasvase ${fmtDate(tv.fecha)} en TALADRO ${tv.taladro || '—'}${locTxt}${pozoTxt}`,
      cantidad: 1, precio, subtotal: precio, tipo: 'trasvase', _ref: tv,
    });
  });

  const totalDiasStandBy = standbyRows.reduce((s, r) => s + (Number(r.dias) || 0), 0);
  if (totalDiasStandBy > 0) {
    items.push({ concepto: 'Días de Stand By', cantidad: totalDiasStandBy, precio: contrato.precioStandBy, subtotal: totalDiasStandBy * contrato.precioStandBy, tipo: 'standby' });
  }

  const consumoItems = [];
  [['Camioneta ' + PLACA_CAMIONETA, consumoCamioneta], ['Tanquero ' + PLACA_TANQUERO, consumoTanquero]].forEach(([label, rowsArr]) => {
    for (const r of rowsArr) {
      if (r.cantidadEntregada != null && r.valorUnitario != null) {
        const monto = r.cantidadEntregada * r.valorUnitario;
        consumoItems.push({ label, row: r, monto });
        items.push({ concepto: `Consumo propio ${label} — factura ${r.factura}`, cantidad: r.cantidadEntregada, precio: r.valorUnitario, subtotal: -monto, tipo: 'descuento', _ref: r });
      }
    }
  });

  const subtotal = items.reduce((s, it) => s + it.subtotal, 0);
  const iva = subtotal * contrato.ivaPct;
  const total = subtotal + iva;
  return { items, subtotal, iva, total, consumoItems, volumenPorTerminal };
}

/* ---------------------------------------------------------------------------
   EXCEPCIONES
--------------------------------------------------------------------------- */
function buildExceptions(opts) {
  const { shayaErrors, informeErrors, trasvasesErrors, fallbackIncluded, trasvasesInRange, mainRows, contrato } = opts;
  const list = [];
  for (const e of [...shayaErrors, ...informeErrors, ...(trasvasesErrors || [])]) list.push({ nivel: 'CRITICO', mensaje: e });
  for (const r of fallbackIncluded) {
    list.push({ nivel: 'INFORMATIVO', mensaje: `Fila incluida por regla de agrupación (# Ref ${r.ref}): comparte pedido con una fila en período aunque su propia fecha de despacho no cae dentro del corte.`, origen: r });
  }
  trasvasesInRange.forEach((tv) => {
    if (!tv.taladro && !tv.locacion) {
      list.push({ nivel: 'REVISAR', mensaje: `Trasvase del ${fmtDate(tv.fecha)}: no tiene taladro ni locación registrados en el Excel de Trasvases. Requiere validación manual.`, origen: tv });
    }
    if (contrato && typeof tv.tarifa === 'number' && tv.tarifa > 0 && Math.abs(tv.tarifa - contrato.precioTrasvase) > 0.01) {
      list.push({ nivel: 'REVISAR', mensaje: `Trasvase del ${fmtDate(tv.fecha)} en TALADRO ${tv.taladro || '—'}: la tarifa del Excel (${fmtMoney(tv.tarifa)}) no coincide con la tarifa fija de contrato (${fmtMoney(contrato.precioTrasvase)}). Se usó la del Excel — validar cuál es correcta.`, origen: tv });
    }
  });
  const cancelados = mainRows.filter((r) => r.isCancelado && !r.isTrasvase);
  for (const c of cancelados) {
    list.push({ nivel: 'INFORMATIVO', mensaje: `Pedido # Ref ${c.ref} (${c.localidad}) marcado CANCELADO en la fuente. Se conserva en el informe, excluido de los cálculos de volumen.`, origen: c });
  }
  const guiaSeen = new Map();
  for (const r of mainRows) {
    if (!r.guia || r.isCancelado || norm(r.guia) === 'cancelado') continue;
    guiaSeen.set(r.guia, (guiaSeen.get(r.guia) || 0) + 1);
  }
  for (const [guia, count] of guiaSeen) {
    if (count > 1) list.push({ nivel: 'CRITICO', mensaje: `Número de guía duplicado en el período: ${guia} (${count} apariciones).` });
  }
  return list;
}

function defaultMonths() {
  const now = new Date();
  const arr = [];
  for (let m = 1; m <= now.getMonth() + 1; m++) arr.push({ year: now.getFullYear(), month: m });
  return arr;
}
function monthTabsList() {
  const all = [...defaultMonths(), ...S.extraMonths];
  const seen = new Set(); const out = [];
  for (const m of all) { const k = m.year + '-' + m.month; if (!seen.has(k)) { seen.add(k); out.push(m); } }
  out.sort((a, b) => a.year - b.year || a.month - b.month);
  return out;
}
function getPeriod() {
  if (S.activeMonth) return periodFromMonth(S.activeMonth.year, S.activeMonth.month);
  const now = new Date();
  return periodFromMonth(now.getFullYear(), now.getMonth() + 1);
}
function getPipeline(period) {
  const shayaRows = S.shayaData ? S.shayaData.rows : [];
  const informeRows = S.informeData ? S.informeData.rows : [];
  const trasvaseRows = S.trasvasesData ? S.trasvasesData.rows : [];
  const { merged, fallbackIncluded } = buildMainTable(shayaRows, period.start, period.end);
  const fallbackSet = new Set(fallbackIncluded);
  const trasvasesInRange = buildTrasvasesFromFile(trasvaseRows, period.start, period.end);
  const consumoCamioneta = buildConsumoPropio(informeRows, PLACA_CAMIONETA, period.start, period.end);
  const consumoTanquero = buildConsumoPropio(informeRows, PLACA_TANQUERO, period.start, period.end);
  const calc = computeFacturacion({ mainRows: merged, trasvasesInRange, standbyRows: S.standbyRows, consumoCamioneta, consumoTanquero, contrato: CONTRATO, manejoIntegralActivo: S.manejoIntegralActivo });
  const exceptions = buildExceptions({
    shayaErrors: S.shayaData ? S.shayaData.structureErrors : [],
    informeErrors: S.informeData ? S.informeData.structureErrors : [],
    trasvasesErrors: S.trasvasesData ? S.trasvasesData.structureErrors : [],
    fallbackIncluded, trasvasesInRange, mainRows: merged, contrato: CONTRATO,
  });
  return { merged, fallbackSet, trasvasesInRange, consumoCamioneta, consumoTanquero, calc, exceptions };
}

--------------------------------------------------------------------------- */
function readWorkbookFile(file, onParsed) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
      onParsed(null, wb);
    } catch (err) {
      onParsed(err, null);
    }
  };
  reader.readAsArrayBuffer(file);
}

function draftKeyFor(year, month) { return `borrador-shaya:${year}-${String(month).padStart(2, '0')}`; }

function buildMonthPayload(extraMeta) {
  return Object.assign({
    shayaRows: S.shayaData.rows.map(serializeRow),
    informeRows: S.informeData.rows.map(serializeRow),
    trasvasesRows: (S.trasvasesData ? S.trasvasesData.rows : []).map(serializeRow),
    standbyRows: S.standbyRows,
    proveedorCombustible: S.proveedorCombustible,
    savedAt: new Date().toISOString(),
  }, extraMeta || {});
}

/* Guardado silencioso y PERSONAL (no compartido) que corre automáticamente
   cada vez que hay datos cargados. Evita perder información subida aunque
   el usuario no presione "Guardar" (que sí comparte con el equipo). */
async function saveDraftQuiet() {
  if (!S.shayaData || !S.informeData || !S.trasvasesData || !S.activeMonth) return;
  const key = draftKeyFor(S.activeMonth.year, S.activeMonth.month);
  const payload = buildMonthPayload({ savedBy: S.editorName.trim() || 'Usuario sin identificar' });
  try { await window.storage.set(key, JSON.stringify(payload), false); } catch (e) { /* silencioso */ }
}

function applyMonthPayload(payload, sourceLabel, dataSourceTag) {
  S.shayaData = { rows: payload.shayaRows.map(deserializeRow), structureErrors: [], sheetName: sourceLabel };
  S.informeData = { rows: payload.informeRows.map(deserializeRow), structureErrors: [], sheetName: sourceLabel };
  S.trasvasesData = { rows: (payload.trasvasesRows || []).map(deserializeRow), structureErrors: [], sheetName: sourceLabel };
  S.standbyRows = payload.standbyRows || [];
  S.proveedorCombustible = payload.proveedorCombustible || 'Primax - Comercial / Tecknologistic';
  S.shayaFile = { name: sourceLabel };
  S.informeFile = { name: sourceLabel };
  S.trasvasesFile = { name: sourceLabel };
  S.dataSource = dataSourceTag;
}

function handleShayaFile(file) {
  S.shayaFile = file; S.loadError = ''; S.dataSource = 'upload';
  readWorkbookFile(file, (err, wb) => {
    if (err) { S.loadError = 'No se pudo leer el archivo: ' + err.message; render(); return; }
    S.shayaData = parseShayaWorkbook(wb);
    render();
    if (S.shayaData && S.informeData && S.trasvasesData) saveDraftQuiet();
  });
}
function handleInformeFile(file) {
  S.informeFile = file; S.loadErrorInforme = ''; S.dataSource = 'upload';
  readWorkbookFile(file, (err, wb) => {
    if (err) { S.loadErrorInforme = 'No se pudo leer el archivo: ' + err.message; render(); return; }
    S.informeData = parseInformeWorkbook(wb);
    render();
    if (S.shayaData && S.informeData && S.trasvasesData) saveDraftQuiet();
  });
}
function handleTrasvasesFile(file) {
  S.trasvasesFile = file; S.loadErrorTrasvases = ''; S.dataSource = 'upload';
  readWorkbookFile(file, (err, wb) => {
    if (err) { S.loadErrorTrasvases = 'No se pudo leer el archivo: ' + err.message; render(); return; }
    S.trasvasesData = parseTrasvasesWorkbook(wb);

/* Importar un JSON exportado previamente (de este mismo Artifact u otra sesión) */
function handleImportJSON(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const payload = JSON.parse(e.target.result);
      if (!payload.shayaRows || !payload.informeRows) throw new Error('El archivo no tiene el formato esperado (faltan shayaRows/informeRows).');
      applyMonthPayload(payload, 'Importado desde JSON', 'upload');
      if (payload._meta && payload._meta.activeMonth) S.activeMonth = payload._meta.activeMonth;
      render();
      saveDraftQuiet();
    } catch (err) {
      window.alert('No se pudo importar el JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
}

/* Al cambiar de mes: si ya hay Excel cargados esta sesión (dataSource==='upload'),
   los mismos datos cubren todos los meses — solo se recalcula el período, sin
   pedir cargar de nuevo. Si no hay carga en sesión, se intenta recuperar primero
   el guardado COMPARTIDO de ese mes, y si no existe, el BORRADOR personal. */
function setActiveMonth(m) {
  S.activeMonth = m;
  if (S.dataSource === 'upload') {
    render();
    fetchSavedMetaQuiet(m);
  } else {
    loadMonthSnapshot(m.year, m.month);
  }
}

async function fetchSavedMetaQuiet(m) {
  const k = monthKey(m);
  if (S.savedMeta[k]) { render(); return; }
  const key = storageKeyFor(m.year, m.month);
  try {
    const res = await window.storage.get(key, true);
    if (res && res.value) {
      const snap = JSON.parse(res.value);
      S.savedMeta[k] = { by: snap.savedBy, at: snap.savedAt };
      render();
    }
  } catch (e) { /* este mes aún no tiene guardado compartido */ }
}

async function loadMonthSnapshot(year, month) {
  const sharedKey = storageKeyFor(year, month);
  try {
    const res = await window.storage.get(sharedKey, true);
    if (res && res.value) {
      const snap = JSON.parse(res.value);
      applyMonthPayload(snap, 'guardado (compartido)', 'snapshot');
      S.savedMeta[monthKey({ year, month })] = { by: snap.savedBy, at: snap.savedAt };
      render();
      return;
    }
  } catch (e) { /* sin guardado compartido para este mes */ }

  const draftKey = draftKeyFor(year, month);
  try {
    const res = await window.storage.get(draftKey, false);
    if (res && res.value) {
      const snap = JSON.parse(res.value);
      applyMonthPayload(snap, 'borrador local (sin compartir)', 'draft');
      render();
      return;
    }
  } catch (e) { /* tampoco hay borrador local para este mes */ }

  resetMonthData();
  S.dataSource = null;
  render();
}
function resetMonthData() {
  S.shayaData = null; S.informeData = null; S.trasvasesData = null; S.standbyRows = [];
  S.shayaFile = null; S.informeFile = null; S.trasvasesFile = null;
}

async function handleSave() {
  if (!S.shayaData || !S.informeData || !S.trasvasesData || !S.activeMonth) return;
  S.saving = true; render();
  const key = storageKeyFor(S.activeMonth.year, S.activeMonth.month);
  const payload = buildMonthPayload({ savedBy: S.editorName.trim() || 'Usuario sin identificar' });
  try {
    await window.storage.set(key, JSON.stringify(payload), true);
    S.savedMeta[monthKey(S.activeMonth)] = { by: payload.savedBy, at: payload.savedAt };
  } catch (e) { /* fallo silencioso */ }
  S.saving = false; render();
}

function addMonth() {
  const input = window.prompt('Agregar mes al historial (formato MM-AAAA), ej: 10-2026');
  if (!input) return;
  const m = input.trim().match(/^(\d{1,2})-(\d{4})$/);
  if (!m) { window.alert('Formato no reconocido. Usa MM-AAAA, ej: 10-2026'); return; }
  const month = Number(m[1]), year = Number(m[2]);
  if (month < 1 || month > 12) { window.alert('Mes fuera de rango (1-12).'); return; }
  S.extraMonths.push({ year, month });
  setActiveMonth({ year, month });
}

function exportJSON() {
  if (!S.shayaData || !S.informeData || !S.trasvasesData) return;
  const payload = buildMonthPayload({
    savedBy: (currentSaved() && currentSaved().by) || S.editorName.trim() || 'Usuario sin identificar',
    _meta: { activeMonth: S.activeMonth, exportedAt: new Date().toISOString(), app: 'SGI Tecknologistic — Facturación Combustible SHAYA' },
  });
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });

  const a = document.createElement('a');
  a.href = url; a.download = `informe-shaya-${monthKey(S.activeMonth)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

async function exportPDF() {
  const target = document.getElementById('app');
  const hidden = [...target.querySelectorAll('.no-print')];
  const prevDisplay = hidden.map((el) => el.style.display);
  hidden.forEach((el) => { el.style.display = 'none'; });
  try {
    const canvas = await html2canvas(target, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'p', unit: 'pt', format: 'a4' });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;
    let heightLeft = imgHeight;
    let position = 0;
    const imgData = canvas.toDataURL('image/png');
    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while (heightLeft > 0) {
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    const label = S.viewMode === 'consolidado' ? 'CONSOLIDADO' : 'INFORME';
    pdf.save(`${label}_SHAYA_${monthKey(S.activeMonth)}.pdf`);
  } finally {
    hidden.forEach((el, i) => { el.style.display = prevDisplay[i]; });
  }
}

  for (const r of pipeline.consumoCamioneta) aoa.push([fmtDate(r.fecha), r.factura, r.guiaTeckno, r.empresa, r.segmento, r.equipo, r.placa, r.autorizado, r.recibe, r.cedula, r.cantidadEntregada]);
  aoa.push([]);
  aoa.push([`CONSUMO DE COMBUSTIBLE DE TANQUERO ${PLACA_TANQUERO}`]);
  aoa.push(['Fecha','Factura','Guía Teckno','Empresa','Segmento','Equipo','Placa','Autorizado','Recibe','Cedula','Cantidad entregada']);
  for (const r of pipeline.consumoTanquero) aoa.push([fmtDate(r.fecha), r.factura, r.guiaTeckno, r.empresa, r.segmento, r.equipo, r.placa, r.autorizado, r.recibe, r.cedula, r.cantidadEntregada]);
  aoa.push([]);
  aoa.push(['Documento generado automáticamente por el Artifact SGI Tecknologistic — ' + fmtDate(new Date()) + '. Valores calculados a partir de REPORTE COMBUSTIBLE CLIENTES (hoja SHAYA B61) y REPORTE DIARIO COMBUSTIBLE (hoja Informe).']);

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = Array(15).fill({ wch: 16 });
  XLSX.utils.book_append_sheet(wb, ws, 'FACTURACION SHAYA');
  const fname = `FACTURACION_SHAYA_${fmtDate(period.start).replace(/\//g, '-')}_a_${fmtDate(period.end).replace(/\//g, '-')}.xlsx`;
  XLSX.writeFile(wb, fname);
}

/* ---------------------------------------------------------------------------
   DELEGACIÓN DE EVENTOS
--------------------------------------------------------------------------- */
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.getAttribute('data-action');
  if (action === 'save') { handleSave(); }
  else if (action === 'export-excel') { exportExcel(); }
  else if (action === 'export-pdf') { exportPDF(); }
  else if (action === 'export-json') { exportJSON(); }
  else if (action === 'drive-info') { driveInfo(); }
  else if (action === 'toggle-view') { S.viewMode = S.viewMode === 'consolidado' ? 'interno' : 'consolidado'; render(); }
  else if (action === 'print') { window.print(); }
  else if (action === 'set-month') { setActiveMonth({ year: Number(btn.dataset.year), month: Number(btn.dataset.month) }); }
  else if (action === 'add-month') { addMonth(); }
  else if (action === 'ver-origen') { S.origenRow = ORIGEN_REGISTRY[Number(btn.dataset.origenIdx)]; render(); }
  else if (action === 'close-modal' || action === 'close-modal-overlay') {
    if (action === 'close-modal-overlay' && e.target !== btn) return;
    S.origenRow = null; render();
  }
  else if (action === 'standby-add') {
    S.standbyRows.push({ cliente: 'SHAYA', fechaIngreso: '', fechaSalida: '', dias: '', placa: '', motivo: '' });
    render();
  }
  else if (action === 'standby-del') {
    S.standbyRows.splice(Number(btn.dataset.idx), 1);
    render();
  }
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.matches('[data-role="shaya-file"]')) { if (t.files[0]) handleShayaFile(t.files[0]); }
  else if (t.matches('[data-role="import-json"]')) { if (t.files[0]) handleImportJSON(t.files[0]); t.value = ''; }
  else if (t.matches('[data-role="informe-file"]')) { if (t.files[0]) handleInformeFile(t.files[0]); }
  else if (t.matches('[data-role="trasvases-file"]')) { if (t.files[0]) handleTrasvasesFile(t.files[0]); }
  else if (t.matches('[data-role="manejo-integral"]')) { S.manejoIntegralActivo = t.checked; render(); }
  else if (t.matches('[data-role="standby-field"]')) {
    const idx = Number(t.dataset.idx), field = t.dataset.field;
    S.standbyRows[idx][field] = t.value;
    if (field === 'fechaIngreso' || field === 'fechaSalida') {
      const a = S.standbyRows[idx].fechaIngreso ? new Date(S.standbyRows[idx].fechaIngreso) : null;
      const b = S.standbyRows[idx].fechaSalida ? new Date(S.standbyRows[idx].fechaSalida) : null;
      S.standbyRows[idx].dias = (a && b) ? Math.max(0, Math.round((b - a) / 86400000)) : '';
    }
    render();
  }
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.matches('[data-role="editor-name"]')) { S.editorName = t.value; }
  else if (t.matches('[data-role="proveedor"]')) { S.proveedorCombustible = t.value; }
  else if (t.matches('[data-role="standby-field"]') && (t.dataset.field === 'cliente' || t.dataset.field === 'placa' || t.dataset.field === 'motivo')) {
    S.standbyRows[Number(t.dataset.idx)][t.dataset.field] = t.value;
  }
});

/* ---------------------------------------------------------------------------
   INICIALIZACIÓN
--------------------------------------------------------------------------- */
(function init() {
  const tabs = monthTabsList();
  S.activeMonth = tabs[tabs.length - 1];
  render();
  loadMonthSnapshot(S.activeMonth.year, S.activeMonth.month);
})();
</script>
<div id="modal-root"></div>
</body>
</html>
